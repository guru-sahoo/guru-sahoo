name: Update contribution graphs

on:
  schedule:
    - cron: "30 */3 * * *"   # every 3 hours (GitHub may delay scheduled runs)
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - assets/**   # the bot's own SVG commits must not retrigger this

permissions:
  contents: write

concurrency:
  group: contribution-graphs
  cancel-in-progress: true

jobs:
  graphs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_USER: ${{ github.repository_owner }}
        run: python scripts/generate_graphs.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git diff --cached --quiet || (git commit -m "chore: update contribution graphs" && git push)
